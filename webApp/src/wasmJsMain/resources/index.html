<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2E4A7D">
  <title>Jibiki 字引</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #FBF9F4; }
    @media (prefers-color-scheme: dark) { html, body { background: #141413; } }
    #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
            font: 48px/1 system-ui, sans-serif; color: #2E4A7D; opacity: .35; pointer-events: none; }
    #unsupported { display: none; padding: 2rem; font: 16px/1.5 system-ui, sans-serif; }
  </style>
  <script>
    // Kotlin/Wasm needs WasmGC (Firefox 120+, Chrome 119+, Safari 18.2+).
    const ok = typeof WebAssembly === "object" && WebAssembly.validate(new Uint8Array([
      0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 95, 1, 120, 0]));
    if (!ok) document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("boot").remove();
      document.getElementById("unsupported").style.display = "block";
    });
  </script>
  <script src="jibiki.js"></script>
</head>
<body>
  <div id="boot">字引</div>
  <div id="unsupported">Jibiki needs a newer browser (Firefox 120+, Chrome 119+ or Safari 18.2+).</div>
</body>
</html>
