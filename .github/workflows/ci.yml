name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The runner image ships the Android SDK; accepting licenses lets AGP download platform 37.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew jvmTest --console=plain

      - name: Android debug APK
        run: ./gradlew :androidApp:assembleDebug --console=plain

      - name: Web production bundle
        run: |
          ./gradlew :webApp:wasmJsBrowserDistribution --console=plain --info > /tmp/web.log 2>&1 || { grep -n -A30 'Task :kotlinWasmNpmInstall' /tmp/web.log | cut -c1-240 | head -80; ls build/wasm build/wasm/node_modules | head -30; exit 1; }

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"

      - name: Upload APK and web bundle
        uses: actions/upload-artifact@v4
        with:
          name: builds
          path: |
            androidApp/build/outputs/apk/debug/*.apk
            webApp/build/dist/wasmJs/productionExecutable
