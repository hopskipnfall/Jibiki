name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Android SDK (platform 37 / build-tools) is auto-installed by AGP when licenses are accepted.
      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew jvmTest --console=plain

      - name: Android debug APK
        run: ./gradlew :androidApp:assembleDebug --console=plain

      - name: Web production bundle
        run: ./gradlew :webApp:wasmJsBrowserDistribution --console=plain

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"

      - name: Upload APK and web bundle
        uses: actions/upload-artifact@v4
        with:
          name: builds
          path: |
            androidApp/build/outputs/apk/debug/*.apk
            webApp/build/dist/wasmJs/productionExecutable
